services:
  release-mcp:
    image: ${RELEASE_MCP_IMAGE}
    container_name: ask-release-mcp
    restart: unless-stopped
    hostname: release-mcp
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      RELEASE_BASE_URL: ${RELEASE_INTERNAL_URL:-}
      RELEASE_AUTH_TYPE: ${RELEASE_AUTH_TYPE:-bearer_token}
      RELEASE_TOKEN: ${RELEASE_TOKEN:-}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_READONLY_MODE: ${MCP_READONLY_MODE:-true}
      API_VERIFY_SSL: ${MCP_VERIFY_SSL:-true}
      OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-true}
      OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-${OIDC_ISSUER_URI}}
      OAUTH_JWKS_URL: ${MCP_OAUTH_JWKS_URL:-${OIDC_ISSUER_URI}/protocol/openid-connect/certs}
      OAUTH_AUDIENCE: ${MCP_OAUTH_AUDIENCE:-${OAUTH2_TOKEN_CLIENT_ID}}
      OAUTH_ALGORITHMS: ${MCP_OAUTH_ALGORITHMS:-RS256}
      OAUTH_USERNAME_CLAIM: ${MCP_OAUTH_USERNAME_CLAIM:-preferred_username}
      DAI_SERVICE_LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
      DAI_FEATURE__PLAINTEXT_LOGGING: ${MCP_PLAINTEXT_LOGGING:-false}
      DAI_FEATURE__OPEN_TELEMETRY_ENABLED: ${MCP_OTEL_ENABLED:-false}
      DAI_FEATURE__OTEL_LOG_EXPORT: ${MCP_OTEL_LOG_EXPORT:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${MCP_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${MCP_OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json; r=urllib.request.urlopen('http://localhost:8000/utility/healthcheck'); d=json.loads(r.read().decode()); raise SystemExit(0 if d.get('healthy') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: ${MCP_LOG_MAX_SIZE:-10m}
        max-file: "${MCP_LOG_MAX_FILE:-5}"
    networks:
      ask-release-net:
        aliases:
          - release-mcp
