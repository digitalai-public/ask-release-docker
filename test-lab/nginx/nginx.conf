user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # -------------------------------------------------------------------------
    # Core settings
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    server_names_hash_bucket_size 128;

    # Larger client body for chat uploads and provider payloads.
    client_max_body_size 16m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Timeouts: long LLM completions and Release workflow runs need generous read timeouts.
    send_timeout 120s;
    reset_timedout_connection on;

    # MIME
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use Docker's embedded DNS so upstreams can be re-resolved on container restart.
    # `valid=10s` keeps the cache short; `resolve` on each upstream forces
    # periodic re-resolution.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Proxy defaults (shared by every vhost)
    # -------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_connect_timeout 15s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 30s;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;
    proxy_busy_buffers_size 64k;

    # WebSocket upgrade support
    # $connection_upgrade is set by the map below; if no Upgrade header is
    # sent, the connection stays HTTP/1.1 keep-alive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------------------
    # Upstreams (resolve flag forces re-resolution against Docker DNS so
    # containers that restart and get a new IP are picked up automatically).
    # Each upstream owns a 64 KB shared-memory zone (required by the `resolve`
    # directive).
    # -------------------------------------------------------------------------
    upstream assistant_backend {
        zone assistant_backend 64k;
        server release-assistant:8090 max_fails=3 fail_timeout=10s resolve;
        keepalive 16;
    }

    upstream llm_backend {
        zone llm_backend 64k;
        server llm-service-api:9000 max_fails=3 fail_timeout=10s resolve;
        keepalive 16;
    }

    upstream release_backend {
        zone release_backend 64k;
        server release:5516 max_fails=3 fail_timeout=10s resolve;
        keepalive 16;
    }

    upstream keycloak_backend {
        zone keycloak_backend 64k;
        server keycloak:25080 max_fails=3 fail_timeout=10s resolve;
        keepalive 16;
    }

    # -------------------------------------------------------------------------
    # Shared TLS settings
    # TLS 1.2 and 1.3 only. Mozilla "intermediate" profile cipher list.
    # -------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Per-vhost server blocks.
    include /etc/nginx/conf.d/*.conf;
}
