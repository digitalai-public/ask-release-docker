# ----------------------------------------------------------------------------
# Local Keycloak IdP: only used with `--profile with-keycloak`. Keycloak
# is sensitive to absolute URLs in its discovery document, so the upstream
# Host header is set to the public hostname (or the original $host when
# the operator is using `identity.example.digital.ai.local` directly).
# ----------------------------------------------------------------------------
server {
    listen 5443 ssl;
    listen [::]:5443 ssl;
    http2 on;
    server_name identity.example.digital.ai.nginx ${NGINX_IDP_HOSTNAME};

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://keycloak_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 5443;
        # Keycloak's admin UI uses a websocket-style channel.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
