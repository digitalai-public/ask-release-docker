# ----------------------------------------------------------------------------
# Release Assistant: vhost on the *.example.digital.ai.local pattern that
# the rest of the stack already uses.
# ----------------------------------------------------------------------------
server {
    listen 5443 ssl;
    listen [::]:5443 ssl;
    http2 on;
    server_name release-assistant.example.digital.ai.nginx ${NGINX_ASSISTANT_HOSTNAME};

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Streaming chat responses (SSE) must flush promptly.
    proxy_buffering off;
    proxy_cache off;

    location / {
        proxy_pass http://assistant_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 5443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Streaming chat needs a long read timeout.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
