# ----------------------------------------------------------------------------
# Digital.ai Release: only used with `--profile with-release`. WebSockets
# are required for the Release UI's push channel and task runner events.
# ----------------------------------------------------------------------------
server {
    listen 5443 ssl;
    listen [::]:5443 ssl;
    http2 on;
    server_name release.example.digital.ai.nginx ${NGINX_RELEASE_HOSTNAME};

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Release web UI: keepalive for the websocket push channel.
    proxy_buffering off;
    proxy_cache off;

    # WebSocket upgrades can be long-lived (Release task runners may run for
    # hours). `proxy_read_timeout` does not accept a runtime variable, so a
    # generous literal 24h is set on this vhost.
    location / {
        proxy_pass http://release_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
